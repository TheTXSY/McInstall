name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: >
          dotnet publish src/McInstall.App/McInstall.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o dist

      - name: Publish CLI
        run: >
          dotnet publish src/McInstall.Cli/McInstall.Cli.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o dist/cli

      - name: Package
        shell: pwsh
        run: |
          Remove-Item dist/*.pdb, dist/cli/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/McInstall.exe, dist/cli -DestinationPath McInstall-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: McInstall-win-x64.zip
          generate_release_notes: true
